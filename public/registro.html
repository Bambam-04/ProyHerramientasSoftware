<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIMA — Crear cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth">
    <h1>Crear cuenta</h1>
    <p class="sub">Solo para alumnos y docentes activos</p>
    <label for="matricula">Matrícula</label>
    <input id="matricula" type="text" inputmode="numeric">
    <label for="correo">Correo institucional</label>
    <input id="correo" type="text" autocomplete="username">
    <label for="password">Contraseña (mínimo 8, con letras y números)</label>
    <input id="password" type="password" autocomplete="new-password">
    <button type="submit" id="registrar">Crear cuenta</button>
    <div id="msg" class="msg" role="alert"></div>
    <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
  </div>
  <script src="app.js"></script>
  <script>
    document.getElementById('registrar').addEventListener('click', async () => {
      mostrar('msg', '');
      try {
        const d = await api('/api/registro', { method: 'POST', sinRedirect: true, body: {
          matricula: document.getElementById('matricula').value,
          correo: document.getElementById('correo').value,
          password: document.getElementById('password').value } });
        mostrar('msg', d.mensaje, 'ok');
      } catch (e) { mostrar('msg', e.message, 'error'); }
    });
  </script>
</body>
</html>
