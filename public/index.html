<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CIMA — Iniciar sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth">
    <h1>CIMA</h1>
    <p class="sub">Préstamo de material de laboratorio, FCQI</p>
    <label for="correo">Correo institucional</label>
    <input id="correo" type="text" autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password">
    <button type="submit" id="entrar">Iniciar sesión</button>
    <div id="msg" class="msg" role="alert"></div>
    <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </div>
  <script src="app.js"></script>
  <script>
    async function entrar() {
      mostrar('msg', '');
      try {
        const d = await api('/api/login', { method: 'POST', sinRedirect: true,
          body: { correo: document.getElementById('correo').value, password: document.getElementById('password').value } });
        localStorage.setItem('token', d.token);
        localStorage.setItem('usuario', JSON.stringify(d.usuario));
        location.href = d.usuario.rol === 'ADMIN' ? '/admin.html' : '/catalogo.html';
      } catch (e) { mostrar('msg', e.message, 'error'); }
    }
    document.getElementById('entrar').addEventListener('click', entrar);
    document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
  </script>
</body>
</html>
